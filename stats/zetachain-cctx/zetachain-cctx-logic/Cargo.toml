[package]
name = "zetachain-cctx-logic"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
zetachain-cctx-entity = { path = "../zetachain-cctx-entity" }
anyhow = "1.0"
async-trait = "0.1"
blockscout-display-bytes = "1.0"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "postgres-array",
] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
governor = "0.6"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-stream = "0.3"
zetachain-cctx-proto = { path = "../zetachain-cctx-proto" }

[dev-dependencies]
blockscout-service-launcher = { version = "0.22.0", features = [
    "test-database",
    "database-1",
] }
rand = "0.9.1"
pretty_assertions = "1.3"
zetachain-cctx-migration = { path = "../zetachain-cctx-migration" }
wiremock = "0.6"
