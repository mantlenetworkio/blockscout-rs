[package]
name = "visualizer-proto"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
license = "LicenseRef-Blockscout"

[dependencies]
actix-web = "4"
actix-prost = { version = "0.4.0" }
actix-prost-macros = { version = "0.4.0" }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3.21", features = ["hex", "base64"] }
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
actix-prost-build = { version = "0.4.0" }
tonic-build = "0.14"
tonic-prost-build = "0.14"
prost-build = "0.14"