[package]
name = "visualizer-server"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Blockscout"

[lib]
doctest = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
visualizer = { path = "../visualizer" }
visualizer-proto = { path = "../visualizer-proto" }

actix-web = "4"
amplify = { version = "3.13.0", features = ["derive"] }
anyhow = "1.0"
async-trait = "0.1"
blockscout-service-launcher = { workspace = true }
bytes = "1.2"
config = "0.13"
lazy_static = "1.3"
regex = "1.7"
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3.21", features = ["hex", "base64"] }
tokio = "1.21"
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"

[dev-dependencies]
assert-str = "0.1"
blockscout-service-launcher = { workspace = true, features = ["test-server"] }
pretty_assertions = "1.3"
reqwest = { version = "0.12.4", features = ["json"] }
serde_json = "1.0"
url = "2.5.0"
walkdir = "2.3"

[build-dependencies]
actix-prost-build = { version = "0.4.0" }
tonic-build = "0.14"
tonic-prost-build = "0.14"
prost-build = "0.14"