[package]
name = "multichain-search"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Blockscout"

[dependencies]
actix-web = "4"
actix-cors = "0.6"
anyhow = "1.0"
awc = { version = "3.0.0", features = ["openssl"] }
chrono = { version = "0.4.22", features = ["serde"] }
config = "0.13"
futures = "0.3"
http-serde = "1.1"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.21", features = ["chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.5.9"
tracing = { version = "0.1", features = ["log"] }
tracing-actix-web = "0.6.0"
tracing-log = "0.1.3"
tracing-opentelemetry = "0.33"
tonic = "0.14"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.3"
wiremock = "0.6"
